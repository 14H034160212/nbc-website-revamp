name: Sync from nbc.org.nz

# Re-mirror the church's site, rebuild the prototype, push. Cloudflare Pages
# deploys on push, so a green run here is a deploy.
#
# WHY WEEKLY AND NOT NIGHTLY
#   This fetches every page and asset from a small church's server. Their
#   content changes on the order of weeks — a sermon series, a term's
#   programme — so nightly would be a lot of traffic for very little news.
#   Monday 03:00 NZ, so a Sunday's changes are picked up before anyone looks.
#
# WHY IT COMMITS THE BUILT SITE
#   Cloudflare Pages serves this repo as a static upload. There is no build step
#   there on purpose: adding one is what silently broke three deploys (see
#   functions/README.md). The built pages are the artifact.
#
# THE ORDER MATTERS
#   English ships first, on its own commit. Translations are drafted afterwards
#   and either merge or wait. That way the site is never held back by a
#   translation, and a translation is never rushed to keep up with the site.

on:
  schedule:
    - cron: "0 14 * * 0"        # Sunday 14:00 UTC = Monday 03:00 NZST
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── 1. the church's content ──────────────────────────────────────────
      - name: Mirror nbc.org.nz
        id: mirror
        run: |
          python3 build-site.py --fetch 2>&1 | tee mirror.log
          # wget exits non-zero on partial failures that do not matter (a 404 on
          # one asset), so judge by what actually landed instead.
          pages=$(find src/mirror -name 'index.html' | wc -l)
          echo "pages=$pages" >> "$GITHUB_OUTPUT"
          echo "mirrored $pages pages"
          if [ "$pages" -lt 40 ]; then
            echo "::error::only $pages pages mirrored — nbc.org.nz may be down."
            echo "Keeping the current build rather than replacing it with a broken one."
            exit 1
          fi

      - name: Build
        run: python3 build-site.py 2>&1 | tee build.log

      - name: Check
        id: check
        run: |
          set +e
          python3 scripts/check-build.py --summary "$GITHUB_STEP_SUMMARY"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 1 = broken, do not ship. 2 = ship, but a translation went stale.
          if [ "$code" = "1" ]; then exit 1; fi

      # ── 2. ship the English immediately ──────────────────────────────────
      - name: Commit the content update
        id: push
        run: |
          git config user.name  "nbc-sync"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "nothing changed on nbc.org.nz this week"
            echo "changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          python3 scripts/sync-commit-message.py > /tmp/msg.txt
          cat /tmp/msg.txt
          git commit -F /tmp/msg.txt
          git push
          echo "changed=yes" >> "$GITHUB_OUTPUT"

      # ── 3. draft the translations ────────────────────────────────────────
      # Drafting is automated. Publishing is not, for the pages where being
      # wrong would misrepresent the church — see REVIEW_REQUIRED in
      # scripts/check-build.py.
      - name: Draft translations
        id: translate
        if: steps.check.outputs.code == '2' && env.KEY != ''
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node scripts/translate-new.mjs
          python3 build-site.py

      - name: Check the drafts
        id: verify
        if: steps.translate.outcome == 'success'
        run: |
          set +e
          node scripts/check-translations.mjs --only translation-todo.json
          echo "translations=$?" >> "$GITHUB_OUTPUT"
          python3 scripts/check-build.py
          echo "build=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Decide how the drafts ship
        id: route
        if: steps.translate.outcome == 'success'
        run: |
          review=$(python3 -c "import json;print(len(json.load(open('translation-review-required.json'))))")
          if [ "${{ steps.verify.outputs.translations }}" != "0" ] \
             || [ "${{ steps.verify.outputs.build }}" = "1" ]; then
            echo "route=pr" >> "$GITHUB_OUTPUT"
            echo "why=a check on the drafts failed" >> "$GITHUB_OUTPUT"
          elif [ "$review" != "0" ]; then
            echo "route=pr" >> "$GITHUB_OUTPUT"
            echo "why=$review page(s) are on the review-required list" >> "$GITHUB_OUTPUT"
          else
            echo "route=merge" >> "$GITHUB_OUTPUT"
            echo "why=every check passed and no page needs a person" >> "$GITHUB_OUTPUT"
          fi

      # Checks passed and nothing doctrinal changed: straight to main.
      - name: Ship the drafts
        if: steps.route.outputs.route == 'merge'
        run: |
          git add -A
          git commit -m "Translate this week's changes" \
                     -m "Drafted automatically; ${{ steps.route.outputs.why }}." \
                     -m "Checked for script, preserved names and addresses, length against a band measured from the existing dictionary, and English left in place. Register and doctrine are not machine-checkable, which is why the pages on the review-required list never take this path."
          git push

      # Anything else waits for a person. The site is already deployed with the
      # English in place, so nothing is broken while it waits.
      - name: Open a PR for the drafts
        if: steps.route.outputs.route == 'pr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="translations/$(date -u +%Y-%m-%d-%H%M)"
          git checkout -b "$branch"
          git add -A
          git commit -m "Draft translations for this week's changes" \
                     -m "Not merged: ${{ steps.route.outputs.why }}."
          git push -u origin "$branch"
          cat > /tmp/pr-body.md <<'BODY'
          Drafted automatically because nbc.org.nz changed.

          **Not merged**, and the reason is in the commit message. Either a
          mechanical check on the drafts failed, or one of the changed pages is
          on the review-required list — what the church believes, what happens on
          a Sunday, the first-visit page, the home page. A clumsy sentence about
          a youth camp costs little. A mistranslated statement of belief is a
          different kind of mistake.

          The mechanical checks cover script, preserved names and addresses,
          length against a band measured from the existing dictionary, and
          English left in place. They cannot cover register or doctrine, which is
          the whole reason this is a pull request.

          The site is already deployed with the English in place, so nothing is
          broken while this waits.
          BODY
          gh pr create --title "Draft translations for this week's changes" \
                       --body-file /tmp/pr-body.md

      # ── 4. report ────────────────────────────────────────────────────────
      - name: Say what happened
        if: always()
        run: |
          {
            echo "### Sync"
            echo ""
            echo "- mirrored: ${{ steps.mirror.outputs.pages }} pages from nbc.org.nz"
            echo "- content pushed: ${{ steps.push.outputs.changed || 'no' }}"
            case "${{ steps.route.outputs.route }}" in
              merge) echo "- translations: drafted, checked, and shipped" ;;
              pr)    echo "- translations: drafted, waiting in a PR (${{ steps.route.outputs.why }})" ;;
              *)     if [ "${{ steps.check.outputs.code }}" = "2" ]; then
                       echo "- translations: stale, and no ANTHROPIC_API_KEY is set — see the JSON above"
                     fi ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      # Only when a stale translation was neither drafted nor shipped. A red run
      # here means there is something for a person to do, not that anything
      # broke — and it must not disappear into a green tick.
      - name: Flag work left for a person
        if: steps.check.outputs.code == '2' && steps.route.outputs.route != 'merge'
        run: |
          echo "::warning::A translated page is serving English again. The site is"
          echo "::warning::deployed and correct; the affected paragraphs are English."
          echo "::warning::Either a PR is waiting, or the JSON in the summary needs"
          echo "::warning::translating into src/i18n/."
          exit 1
