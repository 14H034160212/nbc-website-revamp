<div id="nbc-ask">

  <div class="ask-head">
    <label>
      <span>Language</span>
      <select data-ask-lang aria-label="Language"></select>
    </label>
  </div>

  <p class="ask-lead" data-ask-lead></p>

  <!-- AI question box. Hidden until /api/ask reports a configured key, so a
       deploy without the secret degrades to the curated finder below. -->
  <form class="ai-box" data-ai-form hidden>
    <label class="ai-box__label" data-ai-label></label>
    <textarea data-ai-input rows="3" maxlength="600"></textarea>
    <div class="ai-box__row">
      <button type="submit" class="ai-box__go" data-ai-go></button>
      <span class="ai-box__note" data-ai-note></span>
    </div>
  </form>
  <div class="ai-off" data-ai-off hidden></div>
  <div class="ai-out" data-ai-out hidden></div>

  <div class="ask-topics" data-ask-topics></div>

  <form class="ask-form" data-ask-form>
    <input type="text" data-ask-input autocomplete="off" spellcheck="false">
    <button type="submit" data-ask-go></button>
  </form>

  <div class="ask-out" data-ask-out hidden></div>

  <p class="ask-pastoral" data-ask-pastoral hidden></p>

</div>

<h2 data-i18n="howH2">How this works</h2>

<p data-i18n-html="how2"></p>
