<!-- ============================================================
     CREED for Mission Effectiveness  —  real HTML + inline SVG
     ------------------------------------------------------------
     REPLACES: Creed.jpg
     The five words are transcribed verbatim from that image.

     The wheel is now inline SVG instead of a photograph, so it stays
     sharp on retina screens, weighs ~2 KB instead of 39 KB, and the
     five labels sit beside it as real text that can be translated,
     searched and read aloud.

     PASTE INTO: a "Custom HTML" block on /what-we-believe/ (or
     wherever Creed.jpg currently sits).
     ============================================================ -->

        <text x="72.4" y="43.2" fill="#DF272C" class="nbc-creed__letter">D</text>

    <ol class="nbc-creed__list">
